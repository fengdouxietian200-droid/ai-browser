<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Reader">
<title>AI Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --sur: #13131a;
  --sur2: #1c1c26;
  --bdr: #2a2a3a;
  --acc: #7c6aff;
  --acc2: #ff6a9e;
  --tx: #e8e8f0;
  --tx2: #8888aa;
  --r: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--tx); }

/* ヘッダー */
#appHeader {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:rgba(10,10,15,0.97);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bdr);
  padding:10px 14px;
  padding-top:max(10px, env(safe-area-inset-top));
}
.hrow { display:flex; align-items:center; gap:10px; }
.logo {
  font-family:'Syne',sans-serif; font-weight:800; font-size:20px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  cursor:pointer; flex-shrink:0; user-select:none;
}
.sbar {
  flex:1; display:flex; align-items:center;
  background:var(--sur2); border:1px solid var(--bdr);
  border-radius:50px; padding:0 6px 0 14px; gap:6px;
}
.sbar input {
  flex:1; background:none; border:none; outline:none;
  color:var(--tx); font-size:16px; padding:9px 0; min-width:0;
  font-family:'DM Sans',sans-serif;
}
.sbar input::placeholder { color:var(--tx2); font-size:14px; }
.sgo {
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  border:none; color:white; width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; cursor:pointer; flex-shrink:0;
}

/* タブ */
#appTabs {
  position:fixed; left:0; right:0; z-index:99;
  background:rgba(10,10,15,0.97);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bdr);
  display:flex;
}
.tab {
  flex:1; padding:12px 8px; background:none; border:none; color:var(--tx2);
  font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500;
  border-bottom:2px solid transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.tab.on { color:var(--acc); border-bottom-color:var(--acc); }

/* リーダーヘッダー */
#readerHeader {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:rgba(10,10,15,0.97);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bdr);
  padding:10px 14px;
  padding-top:max(10px, env(safe-area-inset-top));
  display:none;
  align-items:center; gap:10px;
}
.bbtn {
  background:var(--sur); border:1px solid var(--bdr); color:var(--tx);
  padding:8px 14px; border-radius:50px; font-size:13px; cursor:pointer;
  white-space:nowrap; flex-shrink:0;
}
.rtitle { flex:1; font-size:12px; color:var(--tx2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tlbtn {
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  border:none; color:white; padding:8px 14px; border-radius:50px;
  font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; flex-shrink:0;
}
.tlbtn:disabled { opacity:0.4; }

/* ページ */
.page { display:none; padding-bottom:40px; }
.page.on { display:block; }

/* ホーム */
#pgHome { padding:14px; }
.hero { text-align:center; padding:28px 0 20px; }
.htitle {
  font-family:'Syne',sans-serif; font-size:36px; font-weight:800;
  background:linear-gradient(135deg,#fff 20%,var(--acc) 60%,var(--acc2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:6px;
}
.hsub { font-size:13px; color:var(--tx2); }
.genres { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
.gbtn {
  background:var(--sur); border:1px solid var(--bdr); border-radius:var(--r);
  padding:16px 8px; text-align:center; cursor:pointer;
}
.gbtn:active { border-color:var(--acc); background:var(--sur2); }
.gicon { font-size:24px; margin-bottom:5px; }
.gname { font-size:12px; color:var(--tx2); }
.tipbox {
  background:var(--sur); border:1px solid var(--bdr); border-radius:var(--r);
  padding:14px; font-size:13px; color:var(--tx2); line-height:1.7;
}
.tipbox b { color:var(--acc); }

/* 検索結果 */
#pgResults { padding:14px; }
.rcnt { font-size:12px; color:var(--tx2); margin-bottom:12px; display:flex; align-items:center; gap:6px; }
.rcnt span { background:var(--acc); color:white; font-size:11px; padding:2px 7px; border-radius:4px; }
.rcard {
  background:var(--sur); border:1px solid var(--bdr); border-radius:var(--r);
  padding:14px; margin-bottom:10px; cursor:pointer;
  animation:fu 0.3s ease forwards; opacity:0;
}
.rcard:active { background:var(--sur2); border-color:var(--acc); }
.rsrc { font-size:11px; color:var(--acc); margin-bottom:4px; }
.rtit { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; margin-bottom:5px; line-height:1.3; }
.rsnip { font-size:13px; color:var(--tx2); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

/* リーダー */
#pgReader { padding:14px; background:#0e0e16; min-height:100vh; }
.para-block {
  margin-bottom:18px; padding:12px; border-radius:var(--r);
  border:1px solid transparent; transition:border-color 0.15s, background 0.15s;
}
.para-block.pressing { background:var(--sur2); border-color:var(--acc); }
.pkr { font-size:17px; line-height:2; color:var(--tx); word-break:break-word; }
.pjp {
  font-size:15px; line-height:1.9; color:#c8c8e0;
  margin-top:10px; padding-top:10px; border-top:1px solid var(--bdr);
  display:none;
}
.para-block.tled .pjp { display:block; }
.plbl { font-size:10px; color:var(--tx2); margin-bottom:4px; letter-spacing:0.05em; text-transform:uppercase; font-weight:600; }
.paste-fb {
  background:var(--sur2); border:1px dashed var(--bdr); border-radius:var(--r);
  padding:14px; margin-bottom:14px; font-size:13px; color:var(--tx2); line-height:1.7;
}
.paste-fb b { color:var(--acc); }
.ptarea {
  background:var(--sur); border:1px solid var(--bdr); border-radius:var(--r);
  padding:0 14px; margin-bottom:12px;
}
.ptarea textarea {
  width:100%; background:none; border:none; outline:none; color:var(--tx);
  font-size:16px; line-height:1.8; resize:none; min-height:140px; padding:14px 0;
  font-family:'DM Sans',sans-serif;
}
.ptarea textarea::placeholder { color:var(--tx2); font-size:14px; }

/* 翻訳タブ */
#pgTl { padding:14px; }
.tltit { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; margin-bottom:4px; }
.tlsub { font-size:13px; color:var(--tx2); margin-bottom:16px; }
.mpills { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
.mp {
  padding:8px 14px; border-radius:50px; border:1px solid var(--bdr);
  background:var(--sur); color:var(--tx2); font-size:13px; cursor:pointer;
}
.mp.on { background:linear-gradient(135deg,var(--acc),var(--acc2)); border-color:transparent; color:white; font-weight:500; }
.spills { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.splbl { font-size:12px; color:var(--tx2); }
.sp { padding:6px 12px; border-radius:50px; border:1px solid var(--bdr); background:var(--sur); color:var(--tx2); font-size:13px; cursor:pointer; }
.sp.on { border-color:var(--acc); color:var(--acc); }
.tbx { background:var(--sur); border:1px solid var(--bdr); border-radius:var(--r); padding:0 14px; margin-bottom:12px; }
.tbx:focus-within { border-color:var(--acc); }
.tbx textarea { width:100%; background:none; border:none; outline:none; color:var(--tx); font-size:16px; line-height:1.8; resize:none; min-height:120px; padding:14px 0; font-family:'DM Sans',sans-serif; }
.tbx textarea::placeholder { color:var(--tx2); font-size:14px; }
.tfoot { display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--bdr); padding:7px 0 9px; }
.charc { font-size:11px; color:var(--tx2); }
.clrt { background:none; border:none; color:var(--tx2); font-size:12px; cursor:pointer; }
.runbtn {
  width:100%; padding:14px; border-radius:var(--r); border:none;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:white; font-size:15px; font-weight:500; cursor:pointer; margin-bottom:14px;
}
.runbtn:active { opacity:0.85; }
.runbtn:disabled { opacity:0.4; }
.rbox { background:var(--sur); border:1px solid var(--bdr); border-radius:var(--r); padding:16px; display:none; margin-bottom:10px; animation:fu 0.3s ease; }
.rbox.on { display:block; }
.rbhead { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-family:'Syne',sans-serif; font-weight:700; font-size:14px; }
.bdg { background:linear-gradient(135deg,var(--acc),var(--acc2)); color:white; font-size:10px; padding:2px 8px; border-radius:50px; }
.rbtext { font-size:14px; line-height:1.9; color:var(--tx); white-space:pre-wrap; }
.cpbtn { margin-top:12px; background:var(--sur2); border:1px solid var(--bdr); color:var(--tx2); padding:7px 14px; border-radius:50px; font-size:12px; cursor:pointer; }
.errmsg { background:rgba(255,80,80,0.1); border:1px solid rgba(255,80,80,0.3); border-radius:var(--r); padding:12px 14px; color:#ff8888; font-size:13px; margin-bottom:10px; display:none; }
.errmsg.on { display:block; }

/* 汎用ボタン */
.bigbtn {
  width:100%; padding:13px; border-radius:var(--r); border:none;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:white; font-size:15px; font-weight:500; cursor:pointer; margin-bottom:16px;
}
.bigbtn:active { opacity:0.85; }
.bigbtn:disabled { opacity:0.4; }

/* アクションシート */
#actSheet {
  position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.55);
  display:none; align-items:flex-end;
}
#actSheet.on { display:flex; animation:fi 0.2s; }
.asin {
  width:100%; background:var(--sur); border-radius:20px 20px 0 0;
  padding:12px 14px max(20px,env(safe-area-inset-bottom));
  animation:su 0.25s ease;
}
.astit { font-size:12px; color:var(--tx2); text-align:center; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--bdr); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.asbtn { width:100%; padding:14px; border-radius:var(--r); border:1px solid var(--bdr); background:var(--sur2); color:var(--tx); font-size:15px; font-weight:500; cursor:pointer; margin-bottom:8px; display:flex; align-items:center; justify-content:center; gap:8px; }
.asbtn:active { border-color:var(--acc); }
.asbtn.pri { background:linear-gradient(135deg,var(--acc),var(--acc2)); border-color:transparent; color:white; }
.ascnl { width:100%; padding:14px; border-radius:var(--r); border:none; background:var(--sur); color:var(--tx2); font-size:15px; cursor:pointer; margin-top:4px; }

/* 解説ドロワー */
#drawer {
  position:fixed; inset:0; z-index:400; background:rgba(0,0,0,0.65);
  display:none; align-items:flex-end;
}
#drawer.on { display:flex; animation:fi 0.2s; }
.dwin {
  width:100%; background:var(--sur); border-radius:20px 20px 0 0;
  max-height:75vh; display:flex; flex-direction:column;
  animation:su 0.25s ease;
}
.dhdl { width:36px; height:4px; background:var(--bdr); border-radius:2px; margin:12px auto 0; flex-shrink:0; }
.dhead { padding:14px 16px 12px; border-bottom:1px solid var(--bdr); flex-shrink:0; display:flex; align-items:center; justify-content:space-between; }
.dhtit { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; }
.dclose { background:var(--sur2); border:none; color:var(--tx2); width:28px; height:28px; border-radius:50%; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.dorig { padding:12px 16px; font-size:13px; color:var(--tx2); background:var(--sur2); border-bottom:1px solid var(--bdr); line-height:1.6; flex-shrink:0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.dbody { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px; }
.dtxt { font-size:14px; line-height:1.9; color:var(--tx); white-space:pre-wrap; }
.dcpy { margin-top:14px; width:100%; padding:10px; border-radius:var(--r); border:1px solid var(--bdr); background:var(--sur2); color:var(--tx2); font-size:13px; cursor:pointer; }

/* ローディング */
.ld { display:flex; align-items:center; justify-content:center; gap:6px; padding:20px; color:var(--tx2); font-size:13px; }
.d { width:6px; height:6px; border-radius:50%; background:var(--acc); animation:b 0.8s infinite; }
.d:nth-child(2) { animation-delay:0.15s; }
.d:nth-child(3) { animation-delay:0.3s; }

@keyframes b { 0%,80%,100%{transform:scale(0.6);opacity:0.3;}40%{transform:scale(1);opacity:1;} }
@keyframes fu { from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);} }
@keyframes fi { from{opacity:0;}to{opacity:1;} }
@keyframes su { from{transform:translateY(100%);}to{transform:translateY(0);} }
</style>
</head>
<body>

<!-- 通常ヘッダー -->
<div id="appHeader">
  <div class="hrow">
    <div class="logo" id="logoBtn">AI✦</div>
    <div class="sbar">
      <input type="text" id="SI" placeholder="小説タイトル・ジャンルを検索..." autocomplete="off" />
      <button class="sgo" id="searchBtn">→</button>
    </div>
  </div>
</div>

<!-- タブ -->
<div id="appTabs">
  <button class="tab on" id="tabHome">🏠 ホーム</button>
  <button class="tab" id="tabTl">🌐 翻訳・解説</button>
</div>

<!-- リーダーヘッダー -->
<div id="readerHeader">
  <button class="bbtn" id="backBtn">← 戻る</button>
  <div class="rtitle" id="readerTitle"></div>
  <button class="tlbtn" id="tlAllBtn">🌐 全文翻訳</button>
</div>

<!-- コンテンツ -->
<div id="mainWrap">

  <!-- ホーム -->
  <div class="page on" id="pgHome">
    <div class="hero">
      <div class="htitle">AI Reader</div>
      <div class="hsub">韓国小説を検索・読む・翻訳・AI解説</div>
    </div>
    <div class="genres">
      <div class="gbtn" data-q="munpia 판타지 소설"><div class="gicon">⚔️</div><div class="gname">판타지</div></div>
      <div class="gbtn" data-q="munpia 로맨스 소설"><div class="gicon">💕</div><div class="gname">로맨스</div></div>
      <div class="gbtn" data-q="munpia 무협 소설"><div class="gicon">🥷</div><div class="gname">무협</div></div>
      <div class="gbtn" data-q="munpia 인기 소설"><div class="gicon">🔥</div><div class="gname">인기</div></div>
      <div class="gbtn" data-q="munpia 최신 소설"><div class="gicon">🆕</div><div class="gname">최신</div></div>
      <div class="gbtn" data-q="munpia 소설 추천"><div class="gicon">📖</div><div class="gname">Munpia</div></div>
    </div>
    <div class="tipbox">
      💡 <b>使い方</b><br>
      ① ジャンルや検索で小説を探す<br>
      ② 候補をタップ → ページを自動取得<br>
      ③「🌐 全文翻訳」ボタンで一括翻訳<br>
      ④ 段落を<b>長押し</b>でAI解説
    </div>
  </div>

  <!-- 検索結果 -->
  <div class="page" id="pgResults">
    <div class="rcnt"><span id="rCount">0</span> 件の結果</div>
    <div id="rList"></div>
  </div>

  <!-- リーダー -->
  <div class="page" id="pgReader">
    <div id="readerContent"></div>
  </div>

  <!-- 翻訳タブ -->
  <div class="page" id="pgTl">
    <div class="tltit">翻訳 & AI解説</div>
    <div class="tlsub">韓国語テキストを貼り付けてAI翻訳・解説</div>
    <div class="mpills">
      <button class="mp on" data-mode="translate">🌐 翻訳</button>
      <button class="mp" data-mode="explain">📖 文学解説</button>
      <button class="mp" data-mode="summary">📝 要約</button>
      <button class="mp" data-mode="chars">👥 登場人物</button>
      <button class="mp" data-mode="both">🌐+📖 両方</button>
    </div>
    <div class="spills" id="spills">
      <span class="splbl">スタイル：</span>
      <button class="sp on" data-sty="natural">自然</button>
      <button class="sp" data-sty="literary">文学的</button>
      <button class="sp" data-sty="literal">直訳</button>
    </div>
    <div class="tbx">
      <textarea id="tlText" placeholder="ここに韓国語を貼り付け..."></textarea>
      <div class="tfoot">
        <span class="charc" id="tlCharC">0 文字</span>
        <button class="clrt" id="tlClearBtn">クリア</button>
      </div>
    </div>
    <button class="runbtn" id="runBtn">実行する →</button>
    <div class="errmsg" id="tlErr"></div>
    <div class="rbox" id="tlBox1">
      <div class="rbhead" id="tlBox1Head">✦ 日本語翻訳 <span class="bdg">AI</span></div>
      <div class="rbtext" id="tlBox1Text"></div>
      <button class="cpbtn" data-cp="tlBox1Text">📋 コピー</button>
    </div>
    <div class="rbox" id="tlBox2">
      <div class="rbhead">✦ AI文学解説 <span class="bdg">AI</span></div>
      <div class="rbtext" id="tlBox2Text"></div>
      <button class="cpbtn" data-cp="tlBox2Text">📋 コピー</button>
    </div>
  </div>

</div><!-- /mainWrap -->

<!-- アクションシート -->
<div id="actSheet">
  <div class="asin">
    <div class="astit" id="actTitle"></div>
    <button class="asbtn pri" id="actTlBtn">🌐 この段落を翻訳</button>
    <button class="asbtn" id="actExBtn">🔍 AI解説（文化・歴史・語彙）</button>
    <button class="ascnl" id="actCnl">キャンセル</button>
  </div>
</div>

<!-- 解説ドロワー -->
<div id="drawer">
  <div class="dwin">
    <div class="dhdl"></div>
    <div class="dhead">
      <div class="dhtit">🔍 AI解説 <span class="bdg">AI</span></div>
      <button class="dclose" id="drawerClose">✕</button>
    </div>
    <div class="dorig" id="drawerOrig"></div>
    <div class="dbody">
      <div class="dtxt" id="drawerText"></div>
      <button class="dcpy" data-cp="drawerText">📋 コピー</button>
    </div>
  </div>
</div>

<script>
// ── 状態 ──
let curQuery = '';
let curParas = [];
let selParaIdx = -1;
let curTitle = '';
let pressTimer = null;
let tlMode = 'translate';
let tlStyle = 'natural';

// ── レイアウト計算 ──
function calcHeaderHeight() {
  const h = document.getElementById('appHeader').getBoundingClientRect().height;
  const t = document.getElementById('appTabs').getBoundingClientRect().height;
  return h + t;
}
function calcReaderHeaderHeight() {
  return document.getElementById('readerHeader').getBoundingClientRect().height;
}
function adjustLayout() {
  const hh = calcHeaderHeight();
  document.getElementById('appTabs').style.top = document.getElementById('appHeader').getBoundingClientRect().height + 'px';
  document.getElementById('mainWrap').style.paddingTop = hh + 'px';
}

// ── API ──
async function callAI(prompt, temp=0.7, max=2000, useSearch=false) {
  const res = await fetch('/api/gemini', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prompt, temperature:temp, maxTokens:max, useSearch})
  });
  const d = await res.json();
  if (d.error) throw new Error(d.error);
  return d.text;
}

// ── 画面切り替え ──
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.getElementById('pg' + name).classList.add('on');
  window.scrollTo(0, 0);
}

function setReader(on) {
  document.getElementById('appHeader').style.display = on ? 'none' : '';
  document.getElementById('appTabs').style.display = on ? 'none' : '';
  document.getElementById('readerHeader').style.display = on ? 'flex' : 'none';
  if (on) {
    const rh = calcReaderHeaderHeight();
    document.getElementById('mainWrap').style.paddingTop = rh + 'px';
    showPage('Reader');
  } else {
    adjustLayout();
  }
}

document.getElementById('tabHome').onclick = () => {
  document.getElementById('tabHome').classList.add('on');
  document.getElementById('tabTl').classList.remove('on');
  if (curQuery && document.getElementById('rList').children.length > 0) showPage('Results');
  else showPage('Home');
};
document.getElementById('tabTl').onclick = () => {
  document.getElementById('tabTl').classList.add('on');
  document.getElementById('tabHome').classList.remove('on');
  showPage('Tl');
};
document.getElementById('logoBtn').onclick = () => {
  curQuery = '';
  document.getElementById('SI').value = '';
  setReader(false);
  showPage('Home');
  document.getElementById('tabHome').classList.add('on');
  document.getElementById('tabTl').classList.remove('on');
};

// ── 検索 ──
document.getElementById('SI').addEventListener('keydown', e => {
  if (e.key === 'Enter') { document.getElementById('SI').blur(); doSearch(); }
});
document.getElementById('searchBtn').addEventListener('click', doSearch);

// ジャンルボタン
document.querySelectorAll('.gbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.getElementById('SI').value = btn.dataset.q;
    doSearch();
  });
});

function doSearch() {
  const val = document.getElementById('SI').value.trim();
  if (!val) return;
  curQuery = val;
  document.getElementById('tabHome').classList.add('on');
  document.getElementById('tabTl').classList.remove('on');
  showPage('Results');
  fetchResults(val);
}

async function fetchResults(query) {
  const list = document.getElementById('rList');
  list.innerHTML = ld('検索中...');
  try {
    const prompt = `「${query}」の韓国小説5件をJSON配列のみで返してください:
[{"title":"タイトル","snippet":"あらすじ1文","url":"https://www.munpia.com/page/novel/view/no/1","source":"munpia.com"}]
JSON配列のみ。`;
    const txt = await callAI(prompt, 0.3, 1000);
    const clean = txt.replace(/```json|```/g,'').trim();
    const results = JSON.parse(clean);
    document.getElementById('rCount').textContent = results.length;
    list.innerHTML = '';
    results.forEach((r, i) => {
      const el = document.createElement('div');
      el.className = 'rcard';
      el.style.animationDelay = i * 0.05 + 's';
      el.innerHTML = `<div class="rsrc">🔗 ${esc(r.source||'munpia.com')}</div><div class="rtit">${esc(r.title)}</div><div class="rsnip">${esc(r.snippet)}</div>`;
      el.addEventListener('click', () => openReader(r.url, r.title));
      list.appendChild(el);
    });
  } catch(e) {
    list.innerHTML = `<div class="errmsg on">検索エラー: ${e.message}</div>`;
  }
}

// ── リーダー ──
async function openReader(url, title='') {
  curTitle = title || url;
  curParas = [];
  document.getElementById('readerTitle').textContent = curTitle;
  document.getElementById('tlAllBtn').disabled = true;
  document.getElementById('tlAllBtn').textContent = '🌐 全文翻訳';
  setReader(true);

  const c = document.getElementById('readerContent');
  c.style.padding = '14px';
  c.innerHTML = ld('ページを取得中...');

  try {
    const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
    const res = await fetch(proxyUrl);
    const data = await res.json();
    if (!data.contents) throw new Error('取得失敗');
    const text = extractText(data.contents);
    if (text.length < 50) throw new Error('テキスト不足');
    renderReader(text);
  } catch(e) {
    renderFallback(url);
  }
}

function extractText(html) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');

  // ノイズを削除（広告・メニュー・サイドバーなど）
  const removeSelectors = [
    'script','style','noscript','iframe',
    'nav','header','footer','aside',
    'button','form','input','select',
    '.ad','[class*="ad-"]','[class*="banner"]',
    '[class*="menu"]','[class*="nav"]',
    '[class*="sidebar"]','[class*="comment"]',
    '[class*="share"]','[class*="related"]',
    '[id*="ad"]','[id*="banner"]','[id*="sidebar"]'
  ];
  removeSelectors.forEach(sel => {
    try { doc.querySelectorAll(sel).forEach(el => el.remove()); } catch(e) {}
  });

  // 本文を抽出（munpia向けセレクタ優先）
  const mainSelectors = [
    '.novel_view', '.view-content', '#novel_content',
    '.chapter-content', '.content-section',
    'article', 'main', '[role="main"]',
    '.post-content', '.article-body', '.entry-content',
    '#content', '.content', '.text'
  ];

  let mainEl = null;
  for (const sel of mainSelectors) {
    try {
      const el = doc.querySelector(sel);
      if (el && el.textContent.trim().length > 200) {
        mainEl = el;
        break;
      }
    } catch(e) {}
  }

  // 見つからない場合はbodyから最も長いdivを探す
  if (!mainEl) {
    let maxLen = 0;
    doc.querySelectorAll('div, section, p').forEach(el => {
      const len = el.textContent.trim().length;
      if (len > maxLen && len < 50000) {
        maxLen = len;
        mainEl = el;
      }
    });
  }

  if (!mainEl) mainEl = doc.body;

  return (mainEl?.textContent || '').trim().substring(0, 15000);
}

function renderReader(text) {
  const paras = text.split(/\n{2,}|\n/).map(p=>p.trim()).filter(p=>p.length>10);
  curParas = paras;
  document.getElementById('tlAllBtn').disabled = false;

  const c = document.getElementById('readerContent');
  c.innerHTML = '';

  // ヒント
  const hint = document.createElement('p');
  hint.style.cssText = 'font-size:12px;color:var(--tx2);margin-bottom:14px;line-height:1.6;padding:0 2px;';
  hint.innerHTML = '💡 上の「<b style="color:var(--acc)">全文翻訳</b>」で一括翻訳 ／ 段落を<b style="color:var(--acc)">長押し</b>でAI解説';
  c.appendChild(hint);

  paras.forEach((para, i) => {
    const block = document.createElement('div');
    block.className = 'para-block';
    block.dataset.idx = i;
    block.innerHTML = `<div class="pkr">${esc(para)}</div><div class="pjp" id="jp-${i}"></div>`;

    block.addEventListener('touchstart', () => {
      pressTimer = setTimeout(() => openAction(i, para), 600);
      block.classList.add('pressing');
    }, {passive:true});
    block.addEventListener('touchend', () => {
      clearTimeout(pressTimer);
      block.classList.remove('pressing');
    }, {passive:true});
    block.addEventListener('touchmove', () => {
      clearTimeout(pressTimer);
      block.classList.remove('pressing');
    }, {passive:true});

    c.appendChild(block);
  });
}

function renderFallback(url) {
  const c = document.getElementById('readerContent');
  c.innerHTML = `
    <div class="paste-fb">⚠️ ページを直接取得できませんでした。<br><b>Safariで開いてテキストをコピー → 下に貼り付け</b></div>
    <div class="ptarea"><textarea id="fbText" placeholder="ここに韓国語テキストを貼り付け..." rows="8"></textarea></div>
    <button class="bigbtn" id="fbBtn">読み込む →</button>`;
  document.getElementById('fbBtn').addEventListener('click', () => {
    const t = document.getElementById('fbText')?.value?.trim();
    if (t) renderReader(t);
  });
}

// ── 全文翻訳ボタン ──
document.getElementById('tlAllBtn').addEventListener('click', async () => {
  const btn = document.getElementById('tlAllBtn');
  btn.disabled = true; btn.textContent = '翻訳中...';
  for (let i = 0; i < curParas.length; i++) {
    const block = document.querySelector(`.para-block[data-idx="${i}"]`);
    if (!block || block.classList.contains('tled')) continue;
    await translatePara(i);
  }
  btn.textContent = '✅ 翻訳完了';
});

document.getElementById('backBtn').addEventListener('click', () => {
  setReader(false);
  if (curQuery && document.getElementById('rList').children.length > 0) showPage('Results');
  else showPage('Home');
});

// ── 段落翻訳 ──
async function translatePara(idx) {
  const block = document.querySelector(`.para-block[data-idx="${idx}"]`);
  const jpEl = document.getElementById(`jp-${idx}`);
  if (!block || !jpEl || block.classList.contains('tled')) return;

  block.classList.add('tled');
  jpEl.innerHTML = `<div class="plbl">日本語</div>` + ld('翻訳中...');

  try {
    const result = await callAI(
      `以下の韓国語を自然な日本語に翻訳してください。翻訳文のみ返してください:\n\n${curParas[idx]}`,
      0.5, 600
    );
    jpEl.innerHTML = `<div class="plbl">日本語</div><div>${esc(result)}</div>`;
  } catch(e) {
    jpEl.innerHTML = `<div style="color:#ff8888;font-size:13px;">翻訳エラー</div>`;
  }
}

// ── アクションシート ──
function openAction(idx, para) {
  selParaIdx = idx;
  document.getElementById('actTitle').textContent = para.substring(0,80) + (para.length>80?'...':'');
  document.getElementById('actSheet').classList.add('on');
}
function closeAction() { document.getElementById('actSheet').classList.remove('on'); }

document.getElementById('actSheet').addEventListener('click', e => {
  if (e.target === document.getElementById('actSheet')) closeAction();
});
document.getElementById('actCnl').addEventListener('click', closeAction);

document.getElementById('actTlBtn').addEventListener('click', () => {
  closeAction();
  if (selParaIdx >= 0) {
    const block = document.querySelector(`.para-block[data-idx="${selParaIdx}"]`);
    if (block) block.classList.remove('tled');
    translatePara(selParaIdx);
  }
});

document.getElementById('actExBtn').addEventListener('click', async () => {
  closeAction();
  if (selParaIdx < 0) return;
  const para = curParas[selParaIdx];
  document.getElementById('drawerOrig').textContent = para;
  document.getElementById('drawerText').innerHTML = ld('解説中...');
  document.getElementById('drawer').classList.add('on');
  try {
    const result = await callAI(
      `以下は韓国小説「${curTitle}」の一節です。日本語で詳しく解説してください。\n含める内容：語彙・表現の説明、文化的・歴史的背景、登場人物の感情、場面の重要性\n\n一節:\n${para}`,
      0.7, 1500, true
    );
    document.getElementById('drawerText').textContent = result;
  } catch(e) {
    document.getElementById('drawerText').textContent = `エラー: ${e.message}`;
  }
});

// ── 解説ドロワー ──
document.getElementById('drawer').addEventListener('click', e => {
  if (e.target === document.getElementById('drawer')) document.getElementById('drawer').classList.remove('on');
});
document.getElementById('drawerClose').addEventListener('click', () => document.getElementById('drawer').classList.remove('on'));

// ── 翻訳タブ ──
document.querySelectorAll('.mp').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mp').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    tlMode = btn.dataset.mode;
    document.getElementById('spills').style.display = ['explain','summary','chars'].includes(tlMode) ? 'none' : 'flex';
  });
});
document.querySelectorAll('.sp').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sp').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    tlStyle = btn.dataset.sty;
  });
});
document.getElementById('tlText').addEventListener('input', () => {
  document.getElementById('tlCharC').textContent = document.getElementById('tlText').value.length.toLocaleString() + ' 文字';
});
document.getElementById('tlClearBtn').addEventListener('click', () => {
  document.getElementById('tlText').value = '';
  document.getElementById('tlCharC').textContent = '0 文字';
  document.getElementById('tlBox1').classList.remove('on');
  document.getElementById('tlBox2').classList.remove('on');
});

document.getElementById('runBtn').addEventListener('click', async () => {
  const txt = document.getElementById('tlText').value.trim();
  if (!txt) { showErr('tlErr', 'テキストを入力してください。'); return; }
  const btn = document.getElementById('runBtn');
  btn.disabled = true; btn.textContent = '処理中...';
  document.getElementById('tlErr').classList.remove('on');
  document.getElementById('tlBox1').classList.remove('on');
  document.getElementById('tlBox2').classList.remove('on');
  const src = txt.substring(0,4000);
  const sm = {natural:'自然で読みやすい日本語',literary:'文学的で詩的な日本語',literal:'原文に忠実な直訳'};
  try {
    if (tlMode==='translate'||tlMode==='both') {
      setBox1('✦ 日本語翻訳');
      document.getElementById('tlBox1Text').innerHTML = ld('翻訳中...');
      document.getElementById('tlBox1Text').textContent = await callAI(`次の韓国語テキストを${sm[tlStyle]}に翻訳してください。翻訳文のみ返してください:\n\n${src}`, 0.5);
    }
    if (tlMode==='explain'||tlMode==='both') {
      document.getElementById('tlBox2').classList.add('on');
      document.getElementById('tlBox2Text').innerHTML = ld('解説中...');
      document.getElementById('tlBox2Text').textContent = await callAI(`次の韓国語小説について日本語で文学的な解説をしてください:\n\n${src}`, 0.7, 1500, true);
    }
    if (tlMode==='summary') {
      setBox1('✦ あらすじ要約');
      document.getElementById('tlBox1Text').innerHTML = ld('要約中...');
      document.getElementById('tlBox1Text').textContent = await callAI(`次の韓国小説を日本語で3〜5文で要約してください:\n\n${src}`, 0.5, 800);
    }
    if (tlMode==='chars') {
      setBox1('✦ 登場人物整理');
      document.getElementById('tlBox1Text').innerHTML = ld('整理中...');
      document.getElementById('tlBox1Text').textContent = await callAI(`次の韓国小説から登場人物を日本語でリスト形式で整理してください:\n\n${src}`, 0.5, 800);
    }
  } catch(e) {
    showErr('tlErr', 'エラー: ' + e.message);
  }
  btn.disabled = false; btn.textContent = '実行する →';
});

function setBox1(label) {
  document.getElementById('tlBox1Head').innerHTML = label + ' <span class="bdg">AI</span>';
  document.getElementById('tlBox1').classList.add('on');
}

// コピーボタン
document.querySelectorAll('.cpbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    const txt = document.getElementById(btn.dataset.cp)?.textContent;
    if (txt) navigator.clipboard.writeText(txt).then(() => alert('コピーしました！'));
  });
});

// ── ユーティリティ ──
function showErr(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.classList.add('on'); }
function ld(label) { return `<div class="ld"><div class="d"></div><div class="d"></div><div class="d"></div>${label?`<span style="margin-left:6px">${label}</span>`:''}</div>`; }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// レイアウト初期化
window.addEventListener('load', adjustLayout);
window.addEventListener('resize', adjustLayout);
adjustLayout();
</script>
